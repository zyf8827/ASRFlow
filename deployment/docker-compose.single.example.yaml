# ASRFlow 单实例编排模板 (example)
# 不要直接 compose up 本文件. 先运行:
#   bash deployment/init-compose.sh
# 生成 deployment/docker-compose.yaml + deployment/.env 后再:
#   cd deployment && docker compose up -d
#
# 离线部署流程:
#   1. 构建机上把全部模型目录人工拷贝到仓库根目录 models/ (不入 git; 期望布局见
#      deployment/build.sh 头部: 流式 Paraformer / VAD / 说话人 + onnx/ 导出物, 标点可选):
#        cp -r <各模型目录> models/
#      (或手动运行生成脚本代替拷贝: scripts/prepare_models.sh + scripts/export_onnx.py)
#   2. 构建含模型的镜像 (build.sh 会先逐文件校验 models/ 完整性, 缺文件即中止;
#      ONNX 导出物默认必须打包, WITH_ONNX=0 可跳过) 并导出离线包 (apt/pip 走国内源):
#        bash deployment/build.sh                      # asrflow:1.0.0 (默认)
#        bash deployment/build.sh 1.1.0                # asrflow:1.1.0
#        docker save asrflow:1.0.0 | gzip > asrflow-image.tar.gz
#   3. 目标机器 (无公网) 加载镜像后启动:
#        docker load < asrflow-image.tar.gz
#        cd deployment && docker compose up -d
#
# 环境变量说明:
#   - 下方列出服务支持的全部环境变量, `${VAR:-默认值}` 形式可被 shell 环境变量
#     或 deployment/.env 文件覆盖, 默认值与 config/config.default.yaml 一致。
#   - 模型路径类变量 (STREAMING_ONNX_DIR/VAD_MODEL/SPEAKER_MODEL/PUNC_MODEL)
#     留空时由容器 entrypoint 自动指向镜像内 /opt/asrflow/models 打包模型, 启动
#     全程不访问公网; 需要换模型时挂载目录并填绝对路径即可。
#   - 二遍 Qwen3-ASR 由独立 vLLM 服务承载 (VLLM_URL), 不在本镜像内。
#   - 镜像: asrflow:${ASRFLOW_VERSION:-1.0.0} (amd64/arm64 各一份 Dockerfile,
#     init-compose.sh 在 arm64 宿主上会自动把 build 段指向 Dockerfile.arm64).

services:
  asrflow:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    image: asrflow:${ASRFLOW_VERSION:-1.0.0}
    container_name: asrflow
    restart: always
    # 容器内存上限: init-compose.sh 交互设置, 或直接改 .env 的 ASRFLOW_MEM_LIMIT, 不必重新生成
    mem_limit: ${ASRFLOW_MEM_LIMIT:-2g}
    # 健康检查: /ready 聚合引擎自愈状态(重载循环中 503 摘流)。镜像必带 python3,
    # 不依赖 curl。注意: 原生 docker compose 只标记 unhealthy 不自动重启,
    # 自动拉起需搭配 autoheal 侧车或编排器。
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,os,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:'+os.environ.get('ASR_HTTP_PORT','10096')+'/ready', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 180s # 覆盖 funasr 模型加载(实测可超 1 分钟)
    # 容器 stdout/stderr (json-file) 轮转: 不配置时 docker 默认不封顶, 会打爆宿主磁盘。
    # json-file 只能按大小轮转 (无按天模式): 默认 100m×15, 常规流量下保留 ≥15 天;
    # 需要按天保留的完整日志看应用文件日志 (LOG_ROTATION/LOG_RETENTION, 默认 30 天)
    logging:
      driver: json-file
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-100m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-15}"
    ports:
      - "10095:10095" # WebSocket Gateway for realtime ASR streaming
      - "10096:10096" # HTTP Health, Ready, Sessions API
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # ---- 服务 (server) ----
      - TZ=Asia/Shanghai                          # 容器时区: 东八区, 日志时间戳与宿主一致
      - ASR_SERVER_HOST=0.0.0.0                   # 监听地址
      - ASR_SERVER_PORT=10095                     # WebSocket 端口
      - ASR_HTTP_PORT=10096                       # HTTP (healthz/ready/metrics) 端口
      - RESUME_TTL_SEC=${RESUME_TTL_SEC:-30}      # 掉线会话保留宽限期(s), 0 关闭
      - IDLE_TIMEOUT_SEC=${IDLE_TIMEOUT_SEC:-300} # 无活动会话空闲驱逐阈值(s)
      - ASR_MAX_FRAME_MS=${ASR_MAX_FRAME_MS:-2000} # 单音频帧最大时长(ms), 超长截断
      - MAX_CONNECTIONS=${MAX_CONNECTIONS:-100}   # 会话硬上限(资源闸); 过载拒绝由准入控制负责
      - ASR_WORKER_THREADS=${ASR_WORKER_THREADS:-0} # 推理线程池, 0=自动 min(16, CPU 核)
      - ASR_CONFIG_PATH=${ASR_CONFIG_PATH:-}      # 自定义配置文件(需自行挂载), 留空用默认
      # ---- 负载准入 (探针持续超限 -> 拒新会话保存量会话 SLO) ----
      - ADMISSION_ENABLE=${ADMISSION_ENABLE:-true}          # false 一键关闭
      - ADMISSION_STREAMING_WAIT_MS=${ADMISSION_STREAMING_WAIT_MS:-200} # 首遍合批排队阈值(ms)
      - ADMISSION_VAD_WAIT_MS=${ADMISSION_VAD_WAIT_MS:-150} # VAD 锁排队阈值(ms)
      - ADMISSION_FINAL_FALLBACK_RATE=${ADMISSION_FINAL_FALLBACK_RATE:-0.5} # 二遍回退率阈值
      # ---- 推理设备 ----
      - ASR_DEVICE=${ASR_DEVICE:-cpu}             # 首遍 ONNX 固定 CPU
      # ---- 引擎后端 ----
      - STREAMING_ASR_BACKEND=${STREAMING_ASR_BACKEND:-auto} # auto | onnx | mock (ONNX 合批是唯一真实引擎)
      - VAD_BACKEND=${VAD_BACKEND:-funasr}
      - SPEAKER_BACKEND=${SPEAKER_BACKEND:-funasr}
      - FINAL_ASR_BACKEND=${FINAL_ASR_BACKEND:-vllm_http}      # vllm_http | openai_api | mock
      # ---- 模型路径 (留空 = 自动使用镜像内 /opt/asrflow/models 打包模型, 离线加载) ----
      - VAD_MODEL=${VAD_MODEL:-}
      - SPEAKER_MODEL=${SPEAKER_MODEL:-}
      - PUNC_MODEL=${PUNC_MODEL:-}
      - VAD_MAX_SPEECH_MS=${VAD_MAX_SPEECH_MS:-30000} # 连续语音最长单句时长(ms), 超过强制切分
      # ---- 首遍 ONNX 合批引擎 ----
      - STREAMING_BATCH_SIZE=${STREAMING_BATCH_SIZE:-8}   # 单次合批最大流数
      - STREAMING_BATCH_WINDOW_MS=${STREAMING_BATCH_WINDOW_MS:-15} # 攒批等待窗口(ms)
      - STREAMING_ONNX_DIR=${STREAMING_ONNX_DIR:-}    # 留空 = 镜像内 /opt/asrflow/models/onnx
      - STREAMING_ONNX_QUANT=${STREAMING_ONNX_QUANT:-}    # 留空/true = int8 量化图(默认), false = fp32
      - STREAMING_ONNX_THREADS=${STREAMING_ONNX_THREADS:-} # ORT intra-op 线程数, 留空 = 全部核
      # ---- 二遍 vLLM (Qwen3-ASR, 独立部署) ----
      - VLLM_URL=${VLLM_URL:-http://host.docker.internal:8899/v1/audio/transcriptions}
      - FINAL_ASR_MODEL=${FINAL_ASR_MODEL:-qwen3-asr} # 须与 vLLM --served-model-name 一致
      - FINAL_TIMEOUT_SEC=${FINAL_TIMEOUT_SEC:-8}        # 二遍单句硬超时(s)
      - FINAL_MAX_CONCURRENCY=${FINAL_MAX_CONCURRENCY:-32} # 二遍并发上限(按句计)
      - FINAL_MAX_TOKENS=${FINAL_MAX_TOKENS:-512}        # 二遍单句生成 token 上限
      - FINAL_CONTEXT_HISTORY_CHARS=${FINAL_CONTEXT_HISTORY_CHARS:-200} # 二遍 S3 历史上下文尾部字数, 0=不传
      # ---- 日志 ----
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-logs}                  # 容器内日志目录 (挂载到宿主 ASRFLOW_LOG_BASE)
      - LOG_FILE=${LOG_FILE:-}                    # 留空 = <log_dir>/asrflow.log
      - LOG_ROTATION=${LOG_ROTATION:-00:00}       # "00:00"=每日零点 | "1 day" | "100 MB"
      - LOG_RETENTION=${LOG_RETENTION:-30 days}   # 轮转保留时长
      # ---- Nacos 服务注册 (单实例默认关闭; 多实例见 docker-compose.multi.example.yaml) ----
      - NACOS_ENABLE=${NACOS_ENABLE:-false}
      - NACOS_SERVER_ENDPOINT=${NACOS_SERVER_ENDPOINT:-127.0.0.1:8848}
      - NACOS_SERVICE_NAME=${NACOS_SERVICE_NAME:-asrflow}
      - NACOS_SERVICE_HOST=${NACOS_SERVICE_HOST:-127.0.0.1} # 注册地址, 不能是 0.0.0.0
      - NACOS_NAMESPACE=${NACOS_NAMESPACE:-public}
      - NACOS_GROUP_NAME=${NACOS_GROUP_NAME:-DEFAULT_GROUP}
      - NACOS_USERNAME=${NACOS_USERNAME:-nacos}
      - NACOS_PASSWORD=${NACOS_PASSWORD:-CHANGE_ME}
      - NACOS_HEARTBEAT_SEC=${NACOS_HEARTBEAT_SEC:-5}
    volumes:
      # 日志目录挂载到宿主: 容器内 LOG_DIR=logs -> /app/logs -> 宿主 ASRFLOW_LOG_BASE
      # (默认 /var/log/asrflow, 可在 .env 覆盖; 多实例挂 基目录/instance-N 区分;
      #  轮转/保留策略产生的文件同样落在此目录; 改 LOG_DIR 时需同步调整挂载目标)
      - ${ASRFLOW_LOG_BASE:-/var/log/asrflow}:/app/logs
      # ---- 源码热替换 (可选): 宿主机源码目录整体挂到 /app, 替换镜像内代码 ----
      # 模型在 /opt/asrflow/models、entrypoint 在 /usr/local/bin, 均不受挂载影响;
      # 改完宿主机代码 restart 容器即生效, 无需重新构建镜像。
      # 离线目标机器没有源码目录, 保持注释状态。
      # - ..:/app
